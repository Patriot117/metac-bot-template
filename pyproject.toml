[tool.poetry]
name = "metac-bot-template"
version = "0.1.0"
description = ""
authors = ["Vasile Popescu <elisescu@elisescu.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
python-decouple = "^3.8"
requests = "^2.32.3"
asknews = "^0.13.11"
numpy = "^2.3.0"
openai = "^2.0.0"
python-dotenv = "^1.0.1"
forecasting-tools = "^0.3.1"


[tool.poetry.group.integrations]
optional = true

[tool.poetry.group.integrations.dependencies]
lightningrod-ai = "^0.1.14"
# metaculus-bot-review 0.1.1 (latest) pins forecasting-tools <0.3.0, which makes
# the lock unsolvable next to forecasting-tools ^0.3.1. It is only used by
# review_bot.yaml (off unless REVIEW_BOT_ENABLED). Re-add once it supports 0.3.
# metaculus-bot-review = "^0.1.1"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

